<svg width="860" height="230" viewBox="0 0 860 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Foodex product flow</title>
  <desc id="desc">Three illustrated steps: search products, subscribe in Stripe test mode, and view protected nutrition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B5ED7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="860" height="230" rx="24" fill="url(#bg)"/>
  <circle cx="786" cy="28" r="74" fill="#DBEAFE" fill-opacity="0.65"/>
  <circle cx="60" cy="212" r="52" fill="#BFDBFE" fill-opacity="0.4"/>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="232" height="174" rx="18" fill="white"/>
    <rect x="314" y="28" width="232" height="174" rx="18" fill="white"/>
    <rect x="600" y="28" width="232" height="174" rx="18" fill="white"/>
  </g>

  <path d="M272 115H298" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M291 106L300 115L291 124" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M558 115H584" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M577 106L586 115L577 124" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
    <text x="52" y="57" font-size="12" font-weight="700" fill="#2563EB">01</text>
    <text x="52" y="82" font-size="20" font-weight="700">Search</text>
    <text x="52" y="105" font-size="12" fill="#64748B">Find products by name,</text>
    <text x="52" y="122" font-size="12" fill="#64748B">brand, or barcode.</text>

    <text x="338" y="57" font-size="12" font-weight="700" fill="#2563EB">02</text>
    <text x="338" y="82" font-size="20" font-weight="700">Subscribe</text>
    <text x="338" y="105" font-size="12" fill="#64748B">Use Stripe test Checkout</text>
    <text x="338" y="122" font-size="12" fill="#64748B">to unlock the account.</text>

    <text x="624" y="57" font-size="12" font-weight="700" fill="#2563EB">03</text>
    <text x="624" y="82" font-size="20" font-weight="700">View nutrition</text>
    <text x="624" y="105" font-size="12" fill="#64748B">See protected nutrition</text>
    <text x="624" y="122" font-size="12" fill="#64748B">data on product results.</text>
  </g>

  <g transform="translate(55 145)">
    <rect width="178" height="33" rx="9" fill="#EFF6FF"/>
    <circle cx="19" cy="16.5" r="8" stroke="#2563EB" stroke-width="2"/>
    <path d="M25 22.5L31 28.5" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 16.5H23" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <text x="43" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Open Food Facts</text>
  </g>

  <g transform="translate(341 145)">
    <rect width="178" height="33" rx="9" fill="#F1F5F9"/>
    <rect x="14" y="10" width="19" height="14" rx="3" fill="url(#accent)"/>
    <path d="M18 15H29M18 19H25" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="43" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#334155">Stripe test mode</text>
  </g>

  <g transform="translate(627 145)">
    <rect width="178" height="33" rx="9" fill="#ECFDF5"/>
    <path d="M17 17L22 22L31 12" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="43" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#065F46">Subscriber access</text>
  </g>
</svg>
